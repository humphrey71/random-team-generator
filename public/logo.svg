<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 64" fill="none">
  <!-- Clean Icon Symbol -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="#4F46E5" />
    
    <!-- Team Member Nodes -->
    <circle cx="28" cy="16" r="5" fill="#F8FAFC" />
    <circle cx="18" cy="37" r="5" fill="#38BDF8" />
    <circle cx="38" cy="37" r="5" fill="#FBBF24" />

    <!-- Shuffle Orbit Path -->
    <path d="M30 20C34 23 38 29 38 31" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M35 39C30 41 23 41 21 38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M17 32C17 26 23 20 25 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    
    <!-- Center Play/Shuffle Pin -->
    <circle cx="28" cy="28" r="4" fill="#FFFFFF" />
    <path d="M26.5 26.5L30 28L26.5 29.5V26.5Z" fill="#4F46E5" />
  </g>

  <!-- Typography -->
  <text x="70" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.3">
    <tspan fill="#0F172A">Team</tspan><tspan fill="#4F46E5">Generator</tspan>
  </text>
  
  <!-- .ORG Badge - snugly placed right after "r" with 3px tight gap -->
  <g transform="translate(250, 23)">
    <rect width="36" height="18" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2" />
    <text x="18" y="13" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#4F46E5" text-anchor="middle">.ORG</text>
  </g>
</svg>
